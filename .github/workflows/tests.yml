name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ifx 2025.3 / Fortran 2018 / ${{ matrix.build_type }} / FP${{ matrix.precision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # total of 4 combinations (2 build types x 2 FP precisions)
      matrix:
        build_type: [Release, Debug]
        precision: [32, 64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the cache must be restored into a directory the runner user can write
      - name: Prepare Intel oneAPI directory
        run: sudo install -d -o "$(id -un)" -g "$(id -gn)" /opt/intel/oneapi

      # bump the key suffix to force a fresh install with the latest patch updates
      - name: Restore Intel Fortran and MPI
        id: oneapi-cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/intel/oneapi
          key: oneapi-ubuntu-24.04-ifx-2025.3-mpi-2021.18-v1

      # pin the compiler and MPI version series, but allow patch updates on a fresh install
      - name: Install Intel Fortran and MPI
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/ci
          {
            # download to a file, so a retried transfer cannot corrupt the GPG input
            curl --fail --silent --show-error --location \
              --retry 3 --retry-connrefused --retry-max-time 120 \
              --connect-timeout 15 --max-time 60 \
              --output "$RUNNER_TEMP/intel-oneapi-key.pub" \
              https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
            gpg --batch --yes --dearmor \
              --output "$RUNNER_TEMP/oneapi-archive-keyring.gpg" "$RUNNER_TEMP/intel-oneapi-key.pub"
            sudo install -m 0644 "$RUNNER_TEMP/oneapi-archive-keyring.gpg" \
              /usr/share/keyrings/oneapi-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" |
              sudo tee /etc/apt/sources.list.d/oneAPI.list > /dev/null

            # refresh only the Intel repository, so other runner repositories cannot fail this step
            sudo apt-get update --error-on=any -o Acquire::Retries=3 \
              -o Dir::Etc::sourcelist=sources.list.d/oneAPI.list \
              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            sudo apt-get install --no-install-recommends -y -o Acquire::Retries=3 \
              intel-oneapi-compiler-fortran-2025.3 intel-oneapi-mpi-devel-2021.18
            dpkg-query -W intel-oneapi-compiler-fortran-2025.3 intel-oneapi-mpi-devel-2021.18
          } 2>&1 | tee build/ci/dependency-setup.log

      # check the cached or fresh install, so a broken one fails here instead of in CMake
      - name: Check Intel Fortran and MPI
        run: >-
          source /opt/intel/oneapi/compiler/2025.3/env/vars.sh &&
          source /opt/intel/oneapi/mpi/2021.18/env/vars.sh &&
          ifx --version &&
          mpiifx --version

      # save right after a verified install, so a later test failure still keeps the cache
      - name: Save Intel Fortran and MPI
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/intel/oneapi
          key: ${{ steps.oneapi-cache.outputs.cache-primary-key }}

      # the runner image usually ships Ninja, so only fall back to apt when it is missing
      - name: Install Ninja
        run: |
          set -euo pipefail
          if ! command -v ninja > /dev/null; then
            # refresh only the Ubuntu repositories, so other runner repositories cannot fail this step
            apt_options=(
              -o Acquire::Retries=3
              -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources
              -o Dir::Etc::sourceparts=-
              -o APT::Get::List-Cleanup=0
            )
            sudo apt-get "${apt_options[@]}" --error-on=any update
            sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ninja-build
          fi
          ninja --version

      # each step uses a fresh shell, so initialize the Intel environment in each one
      - name: Configure tests
        run: >-
          source /opt/intel/oneapi/compiler/2025.3/env/vars.sh &&
          source /opt/intel/oneapi/mpi/2021.18/env/vars.sh &&
          ifx --version &&
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_Fortran_COMPILER=/opt/intel/oneapi/compiler/2025.3/bin/ifx
          -DMPI_Fortran_COMPILER=/opt/intel/oneapi/mpi/2021.18/bin/mpiifx
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DFFB_FP64=${{ matrix.precision == 64 && 'ON' || 'OFF' }}
          -DFFB_DENSITY_CHECKS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
          -DBUILD_TESTING=ON

      - name: Build tests
        run: >-
          source /opt/intel/oneapi/compiler/2025.3/env/vars.sh &&
          source /opt/intel/oneapi/mpi/2021.18/env/vars.sh &&
          cmake --build build/ci --target FFB ffb_tests --parallel 2

      - name: Run tests
        run: >-
          source /opt/intel/oneapi/compiler/2025.3/env/vars.sh &&
          source /opt/intel/oneapi/mpi/2021.18/env/vars.sh &&
          ctest --test-dir build/ci --output-on-failure --parallel 2 --output-junit test-results.xml

      # retain logs and exported fields for failed test runs
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.build_type }}-fp${{ matrix.precision }}
          path: |
            build/ci/dependency-setup.log
            build/ci/Testing/
            build/ci/test-results.xml
            build/ci/tests/runs/
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
